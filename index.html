<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Hover Pod Racing</title>
</head>
<body>
  <canvas id="bg"></canvas>
  <div id="lobby">
    <header><h1>HOVER POD RACING</h1><div id="conn">connecting to server…</div></header>
    <main>
      <section id="join">
        <canvas id="qr"></canvas>
        <div class="scan">Scan to join</div>
        <div id="url"></div>
        <div id="ipnote"></div>
      </section>
      <section id="slots"></section>
    </main>
    <footer>
      <button data-act="start"><kbd>Enter</kbd> start (when all ready)</button>
      <button data-act="force"><kbd>Shift+Enter</kbd> start anyway</button>
      <button data-act="fs"><kbd>F</kbd> fullscreen</button>
      <button data-act="ip"><kbd>I</kbd> switch IP</button>
      <span class="padhint">Controller: <kbd>A</kbd> join · <kbd>B</kbd> leave · <kbd>Menu</kbd> start</span>
    </footer>
  </div>
  <canvas id="game" style="display:none"></canvas>
  <div id="hud" class="hidden"></div>
  <button id="toLobby" class="hidden" data-act="lobby"><kbd>Esc</kbd> lobby</button>
  <div id="toast"></div>
  <script type="module" src="/src/tv/main.js"></script>
</body>
</html>
