<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#14100d" />
  <title>Pod Controller</title>
</head>
<body>
  <div id="app">
    <div id="bar">
      <div id="chip"><span id="dot"></span><b id="pname">--</b></div>
      <span id="status">connecting…</span>
      <span id="ping">-- ms</span>
      <span id="wake" title="screen wake lock">☀</span>
      <span class="spacer"></span>
      <button id="assist" class="tog">ASSIST: OFF</button>
      <span id="lobbyBtns">
        <button id="ready" class="tog">READY</button>
        <button id="start" class="act" disabled>START</button>
        <button id="leave" class="tog">LEAVE</button>
      </span>
    </div>
    <div id="pads">
      <div id="padL" class="pad"></div>
      <div id="padR" class="pad"></div>
      <canvas id="view"></canvas>
      <button id="vent">VENT</button>
    </div>
  </div>
  <div id="overlay" class="hidden"><div id="overlayBox"><h2 id="ovTitle"></h2><p id="ovText"></p><button id="ovBtn" class="act"></button></div></div>
  <div id="rotate"><div>↻<br>Rotate your phone<br>to landscape</div></div>
  <script type="module" src="/src/controller/main.js"></script>
</body>
</html>
